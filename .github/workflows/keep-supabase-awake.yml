# Supabase pauses a free project after 7 days without activity. Opening the
# website is not enough, because the frontend never touches the database: only
# the backend does. GET /history/<thread_id> makes the backend read the
# checkpoint tables in Postgres, so one request here counts as real activity.
#
# It runs twice a week rather than once, because GitHub can delay scheduled
# runs and a weekly ping would sit right on the 7-day limit.

name: Keep Supabase awake

on:
  schedule:
    - cron: "0 9 * * 1,4" # Mondays and Thursdays, 09:00 UTC
  workflow_dispatch: # lets the workflow be run by hand from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Query the database through the backend
        # Render's free instance sleeps too and takes about a minute to wake,
        # hence the long timeout and the retries.
        run: |
          curl --fail --silent --show-error \
            --max-time 180 --retry 3 --retry-delay 30 --retry-all-errors \
            https://my-personal-chef.onrender.com/history/keepalive-ping
